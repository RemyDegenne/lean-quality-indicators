# Corpus definitions for the quality-indicator tests.
#
# A library is a union of sources; each source is a git clone under repos/<dir>, pinned in
# libraries.lock.json (see scripts/fetch.py). Only `.lean` files under an `include` prefix are
# scanned; `exclude` holds fnmatch patterns on the path relative to the clone ('*' crosses '/').
# `[defaults]` applies to every source.

[defaults]
# Machine-generated numerical certificates (Lean Pool: ConwaySoifer, MovingSofa,
# NFWeakPartition; a few in Tau Ceti). Thousands of hypothesis-free `decide`/`norm_num` checks
# that would dominate a uniform sample.
exclude = ["*/Certificates/*"]
# Deprecated declarations are compatibility shims, not maintained API.
skip_deprecated = true
# Private helpers often carry deliberate normalising (WLOG) hypotheses set up by their caller.
skip_private = true

[[library]]
id = "mathlib"
name = "Mathlib"

[[library.source]]
dir = "mathlib"
url = "https://github.com/leanprover-community/mathlib4"
include = ["Mathlib/"]
# Metaprogramming and tactic support, not mathematics.
exclude = ["Mathlib/Tactic/*", "Mathlib/Util/*", "Mathlib/Lean/*", "Mathlib/Testing/*",
           "Mathlib/Deprecated/*"]

[[library]]
id = "tauceti"
name = "Tau Ceti"

[[library.source]]
dir = "tauceti"
url = "https://github.com/TauCetiProject/TauCeti"
include = ["TauCeti/"]

[[library]]
id = "lean-pool"
name = "Lean Pool"

[[library.source]]
dir = "lean-pool"
url = "https://github.com/Vilin97/lean-pool"
include = ["LeanPool/"]

[[library]]
id = "flt-anthropic"
name = "FLT (Anthropic)"

# One `Theorems/Thm_X.lean` wrapper per proof-DAG node restates the theorem and delegates to
# `P2MW.S_X.solution` in `P2M/Sol/S_X.lean`, which carries the proof and its helper lemmas.
# The wrappers are skipped so that each DAG node is sampled once, through its `solution`.
[[library.source]]
dir = "flt-anthropic"
url = "https://github.com/anthropics/fermats-last-theorem"
include = ["P2M/Sol/", "P2M/Derive/", "Definitions/"]
# FLT's own scoping commands (defined in P2M/Util.lean), kept as context like `open`.
context_commands = ["p2m_open", "p2m_open_scoped", "p2m_reactivate"]
other_commands = ["p2m_export", "p2m_export_all", "p2m_alias", "p2m_ns"]

