# Verdicts that count as a finding (report.py, stats.py, agreement.py). `no_docstring` is given
# by rule, without a judge, to every sampled definition that has no docstring.
positive = ["incorrect", "too_narrow", "no_docstring"]
flag_missing_docstring = true
# Verdicts left out of the rate's denominator: definitions with no mathematical counterpart,
# or whose intended object the judge could not determine.
denominator_excludes = ["not_a_mathematical_object", "unclear"]
# The judge reads the Mathlib and Batteries versions each library pins (`fetch.py --deps`).
mathlib = "pinned"
