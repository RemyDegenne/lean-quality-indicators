# Verdicts that count as a finding (report.py, stats.py, agreement.py).
positive = ["duplicate", "special_case"]
# The judge reads the Mathlib and Batteries versions each library pins in its
# lake-manifest.json (`python3 scripts/fetch.py --deps`): a lemma added to Mathlib after the
# library was written, possibly upstreamed from it, must not count as a duplicate.
mathlib = "pinned"
# Libraries not judged: duplicating Mathlib makes no sense for Mathlib itself.
skip_libraries = ["mathlib"]
# Boolean answer field counted separately among the findings in report.py: here, findings
# whose proof already goes through the Mathlib declaration (wrappers, not re-derivations).
split_field = "proof_uses_it"
